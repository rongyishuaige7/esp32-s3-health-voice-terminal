name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: health-voice-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository and hardware-free contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Run source and release contracts without provider keys
        env:
          DEEPSEEK_API_KEY: ""
        run: |
          python scripts/secret_scan.py
          python scripts/check_repo.py
          python -m py_compile scripts/*.py tests/*.py tools/*.py
          python -m unittest discover -s tests -v
          python tools/eval_offline.py --scenarios tools/eval_scenarios.json

  firmware:
    name: ESP-IDF 5.5.2 clean firmware build
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    container:
      image: espressif/idf:v5.5.2
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build ESP32-S3 firmware with empty cloud credentials
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py set-target esp32s3
          idf.py build
      - name: Upload firmware build evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: health-voice-firmware-${{ github.sha }}
          path: |
            build/medical_voice_terminal.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/srmodels/srmodels.bin
            build/flasher_args.json
          if-no-files-found: error
          retention-days: 14
