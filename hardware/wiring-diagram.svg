<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">ESP32-S3 health voice terminal wiring boundary</title><desc id="desc">Source-derived connection boundary among ESP32-S3, INMP441, MAX98357A, speaker and ST7789. It is not a PCB schematic and the current hardware has not been retested.</desc>
<style>text{font-family:Inter,Arial,"Noto Sans SC",sans-serif;fill:#24292f}.h{font-size:29px;font-weight:700}.s{font-size:17px;fill:#57606a}.n{font-size:20px;font-weight:700}.p{font-size:15px}.box{fill:#fff;stroke:#8c959f;stroke-width:2;rx:16}.core{fill:#fff7ed;stroke:#f97316;stroke-width:3}.audio{stroke:#8250df;stroke-width:4;fill:none}.display{stroke:#0969da;stroke-width:4;fill:none}.warn{fill:#fff8c5;stroke:#d4a72c;stroke-width:2;rx:12}</style>
<rect width="1200" height="760" fill="#f6f8fa"/><text x="48" y="56" class="h">ESP32-S3 健康科普语音终端 · 接线边界</text><text x="48" y="86" class="s">来自当前源码，不是 PCB 原理图；本轮未完成开发板、音频、屏幕和云链路真机复测</text>
<rect x="55" y="155" width="300" height="250" class="box"/><text x="88" y="197" class="n">INMP441 · I²S0</text><text x="88" y="235" class="p">BCLK → GPIO5</text><text x="88" y="267" class="p">WS → GPIO4</text><text x="88" y="299" class="p">SD → GPIO6</text><text x="88" y="331" class="p">L/R must match LEFT slot</text><text x="88" y="363" class="p">3.3 V + common GND</text>
<rect x="450" y="130" width="300" height="355" class="box core"/><text x="492" y="175" class="n">ESP32-S3</text><text x="492" y="213" class="p">target: esp32s3</text><text x="492" y="245" class="p">defaults: 16 MB + Octal PSRAM</text><text x="492" y="277" class="p">WakeNet + FreeRTOS</text><text x="492" y="309" class="p">Wi-Fi + HTTPS / WSS</text><text x="492" y="341" class="p">exact board unconfirmed</text><path d="M355 280 H450" class="audio"/>
<rect x="845" y="130" width="300" height="215" class="box"/><text x="880" y="172" class="n">MAX98357A · I²S1</text><text x="880" y="210" class="p">BCLK / WS / DIN</text><text x="880" y="242" class="p">GPIO15 / 16 / 7</text><text x="880" y="274" class="p">speaker rating unconfirmed</text><text x="880" y="306" class="p">separate power boundary</text><path d="M750 235 H845" class="audio"/>
<rect x="845" y="400" width="300" height="175" class="box"/><text x="880" y="442" class="n">ST7789 · SPI2</text><text x="880" y="480" class="p">MOSI/SCLK/CS/DC/RST</text><text x="880" y="512" class="p">GPIO11/12/10/9/8</text><text x="880" y="544" class="p">BL enable → GPIO13</text><path d="M750 435 H845" class="display"/>
<rect x="55" y="625" width="1090" height="82" class="warn"/><text x="85" y="658" class="n">门禁</text><text x="180" y="658" class="p">先核精确板型、Flash/PSRAM、模块电压、功放供电、扬声器规格和共地，再上电烧录。</text><text x="180" y="686" class="p">构建通过不证明唤醒、录音、云端回复、播放、健康内容安全或当前硬件运行。</text>
</svg>
